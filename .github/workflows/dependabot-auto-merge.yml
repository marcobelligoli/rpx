name: Dependabot auto-merge

# Enables auto-merge on Dependabot PRs that only bump a patch version. GitHub merges them once the required
# "Build and test" check on develop passes; minor and major bumps are left open for manual review.
on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge for patch updates
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'marcobelligoli/rpx'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
